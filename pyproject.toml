
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "streamstats"
version = "0.1.0"
description = "Streaming analysis of CSV and JSONL event files"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.13,<3",
    "typer>=0.12",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
ignore = ["UP028", "B008"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
